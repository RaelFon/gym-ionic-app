<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Tab 4 </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 4</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-explore-container name="Tab 4 page"></app-explore-container>

  <ion-button expand="block" (click)="presentToast('top')"
    >Present Toast At the Top</ion-button
  >
  <ion-button expand="block" (click)="presentToast('middle')"
    >Present Toast At the Middle</ion-button
  >
  <ion-button expand="block" (click)="presentToast('bottom')"
    >Present Toast At the Bottom</ion-button
  >

  <ion-button (click)="call()" shape="round">
    <ion-icon slot="icon-only" name="heart"></ion-icon>
  </ion-button>

  <ion-list>
    <ng-container *ngFor="let user of users">
      <ion-item>
        <ion-label>{{user.name}} - {{user.role}}</ion-label>
      </ion-item>
    </ng-container>
  </ion-list>
</ion-content>
